[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gravton-agent"
version = "1.0"
description = "Read-only conversational analytics agent over a Gravton GEO Postgres database, with loadable reference skills."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
# Connect to a real Postgres database:
postgres = ["psycopg[binary]>=3.1"]
# Nicer terminal experience (panels, syntax-highlighted SQL, Markdown answers, history):
tui = ["rich>=13.0", "prompt_toolkit>=3.0"]
# Everything:
all = ["psycopg[binary]>=3.1", "rich>=13.0", "prompt_toolkit>=3.0"]

[project.scripts]
gravton = "gravton_agent:main"

[tool.setuptools]
py-modules = ["gravton_agent"]